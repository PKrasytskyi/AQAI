# Orchestrator project profile.
# Secrets are intentionally not stored here. Prefer environment variables or JVM
# system properties for runtime overrides:
#   PROJECT_PROFILE_ID, PROJECT_NAME, PROJECT_BASE_URL
#   PROJECT_ROUTE_HOME, PROJECT_ROUTE_LOGIN, PROJECT_ROUTE_AUTHENTICATED
#   UI_BASE_URL, UI_BROWSER, UI_HEADLESS, UI_TIMEOUT_SECONDS
#   TEST_VALID_USERNAME, TEST_VALID_PASSWORD, TEST_INVALID_USERNAME, TEST_INVALID_PASSWORD
#   OPENAI_API_KEY, RAG_OPENAI_API_KEY, API_AUTH_TOKEN
#   KNOWLEDGE_GRAPH_NEO4J_PASSWORD, KNOWLEDGE_VECTOR_OPENAI_API_KEY
#   KNOWLEDGE_DB_STATUS=false/true to disable/enable RAG + Neo4j + Qdrant together
#   UI_RUNTIME_EVIDENCE_COLLECTOR, UI_BIDI_ENABLED, UI_LIVE_SMOKE_ENABLED
project.profile-id=orangeHRM
project.profile.file=profiles/orangehrm.project-profile.yaml
project.name=OrangeHRM
project.base-url=https://opensource-demo.orangehrmlive.com/web/index.php
project.route.home=/auth/login
project.route.login=/auth/login
project.route.authenticated=/dashboard/index
project.output.generated-pages-package=ua.demo.agentlab.ui.generated.pages
project.output.generated-tests-package=ua.demo.agentlab.ui.generated.tests

# API demo profile. GoRest GET endpoints can run without a token.
# Mutation endpoints require API_AUTH_TOKEN or PROJECT_API_AUTH_TOKEN.
# Override with PROJECT_API_BASE_URL, API_BASE_URL, PROJECT_API_ENDPOINT_SEED.
api.enabled=false
api.preview.enabled=false
# API endpoint discovery seed.
# Format: METHOD /path optional-operation-name; METHOD /path optional-operation-name
# This is used as stable endpoint evidence when OpenAPI is unavailable or incomplete.
project.api.base-url=https://gorest.co.in
project.api.auth.token=${API_AUTH_TOKEN}
api.base-url=${project.api.base-url}
api.auth.token=${API_AUTH_TOKEN}
project.api.endpoint-seed=GET /public/v2/users listUsers; GET /public/v2/users/{id} getUser; POST /public/v2/users createUser; PATCH /public/v2/users/{id} updateUser; PUT /public/v2/users/{id} replaceUser; DELETE /public/v2/users/{id} deleteUser; GET /public/v2/posts listPosts; GET /public/v2/comments listComments; GET /public/v2/todos listTodos; GET /public/v2/users/{id}/posts listUserPosts; POST /public/v2/users/{id}/posts createUserPost; GET /public/v2/posts/{id}/comments listPostComments; POST /public/v2/posts/{id}/comments createPostComment; GET /public/v2/users/{id}/todos listUserTodos; POST /public/v2/users/{id}/todos createUserTodo

# UI runtime configuration. The UiRuntimeConfig loader reads direct env overrides
# such as UI_BASE_URL/UI_BROWSER/UI_HEADLESS/UI_TIMEOUT_SECONDS before these values.
ui.base-url=https://opensource-demo.orangehrmlive.com/web/index.php
ui.browser=chrome
ui.headless=true
ui.timeout-seconds=10
ui.runtime.evidence.collector=bidi
ui.bidi.enabled=true
ui.bidi.max-buffered-events=5000
ui.live-smoke.enabled=true

# Discovery authentication for protected pages.
# Credentials resolve from TEST_VALID_USERNAME / TEST_VALID_PASSWORD.
discovery.auth.enabled=true
discovery.auth.username=${test.credentials.valid.username}
discovery.auth.password=${test.credentials.valid.password}
discovery.auth.username-selector=input[name='username'], input#username, input[type='email'], input[name*='user'], input[id*='user']
discovery.auth.password-selector=input[name='password'], input#password, input[type='password'], input[name*='pass'], input[id*='pass']
discovery.auth.submit-selector=button[type='submit'], input[type='submit'], button, input[type='button']
discovery.auth.timeout-seconds=5

# Typed discovery readiness rules. Values are capability-scoped and use ';' to
# separate required CSS selector groups. Discovery captures HTML/screenshots only
# after all required groups for the matched capability are visible, or after the
# timeout when the application never reaches the readiness state.
ui.discovery.readiness.timeout-ms=12000
ui.discovery.readiness.authentication.required-css=input[name='username'], input[id*='user' i], input[placeholder*='user' i]; input[type='password'], input[name='password'], input[id*='pass' i]; button[type='submit'], input[type='submit'], button
ui.discovery.readiness.authentication.ready-text=username;password;login
ui.discovery.readiness.dashboard.required-css=nav, aside, header, [role='navigation'], [class*='dashboard' i], button
ui.discovery.readiness.dashboard.ready-text=dashboard;profile;logout

# OpenAI assistive layer. Defaults are demo-ready; disable with OPENAI_ENABLED=false
# or -Dopenai.enabled=false when a deterministic/no-key run is required.
# Page enrichment uses openai.* directly and does not depend on rag.enabled.
openai.enabled=true
openai.strict=true
openai.assistive-only=true
ai.page-enrichment.llm.enabled=true
ai.page-object.llm.enabled=true
ai.ui-test.llm.enabled=false
openai.model=gpt-5-mini
openai.base-url=https://api.openai.com/v1
openai.api-key=${OPENAI_API_KEY}
openai.max-output-tokens=4000

# RAG layer. Optional Qdrant API key is read from RAG_QDRANT_API_KEY.
rag.enabled=true
rag.qdrant.url=http://localhost:6333
rag.qdrant.api-key=
rag.qdrant.collection=agentlab-project-style
rag.index.chunks-jsonl=target/rag/chunks.jsonl
rag.chunk.max-chars=1800
rag.chunk.overlap-chars=250
rag.retrieval.limit=8
rag.openai.api-key=
rag.openai.embedding-model=text-embedding-3-small
rag.openai.generation-model=gpt-5-mini
rag.openai.base-url=https://api.openai.com/v1
rag.openai.max-output-tokens=1800

# UI knowledge graph + vector persistence.
# Optional values:
#   KNOWLEDGE_GRAPH_NEO4J_PASSWORD
#   KNOWLEDGE_VECTOR_QDRANT_API_KEY
#   KNOWLEDGE_VECTOR_OPENAI_API_KEY or OPENAI_API_KEY
knowledge.graph.enabled=true
knowledge.graph.neo4j.url=http://localhost:7474
knowledge.graph.neo4j.database=neo4j
knowledge.graph.neo4j.username=neo4j
knowledge.graph.neo4j.password=
knowledge.vector.enabled=true
knowledge.vector.qdrant.url=http://localhost:6333
knowledge.vector.qdrant.api-key=
knowledge.vector.qdrant.collection=agentlab-ui-knowledge
knowledge.vector.openai.api-key=
knowledge.vector.openai.embedding-model=text-embedding-3-small
knowledge.vector.openai.base-url=https://api.openai.com/v1

# Artifact reuse layer. KNOWLEDGE_DB_STATUS=false disables this together with
# Neo4j/Qdrant so no-DB comparison runs do not reuse generated artifacts.
artifact.reuse.enabled=true
artifact.reuse.force-refresh=false
artifact.reuse.stable-root=target/ai-run-history/stable
artifact.reuse.prompt-template-version=pom-json-generation-v3
artifact.reuse.flow-contract.enabled=true
artifact.reuse.pom-contract.enabled=true
artifact.reuse.test-data.enabled=false
artifact.reuse.policy=strict
artifact.reuse.explain-decisions=true
artifact.reuse.writer-version=deterministic-pom-java-writer-v1
semantic.reuse.enabled=true

# Generated runtime / legacy compatibility layer.
# These keys are still used by ConfigReader, test-data.properties, generated tests,
# API auth, and live smoke. Keep them synchronized with the active profile.
test.base-url=https://opensource-demo.orangehrmlive.com/web/index.php
test.browser=chrome
test.headless=true
test.timeout-seconds=10
test.credentials.valid.username=${TEST_VALID_USERNAME}
test.credentials.valid.password=${TEST_VALID_PASSWORD}
test.credentials.invalid.username=${TEST_INVALID_USERNAME}
test.credentials.invalid.password=${TEST_INVALID_PASSWORD}
