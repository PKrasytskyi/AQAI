# Example configuration for local demos.
# Copy values into environment variables or pass them as -D JVM system properties.
# Do not commit real private credentials or tokens.

# UI project profile
project.profile-id=orangeHRM
project.name=OrangeHRM
project.base-url=https://opensource-demo.orangehrmlive.com/web/index.php
project.route.home=/auth/login
project.route.login=/auth/login
project.route.authenticated=/dashboard/index
project.route.form=/auth/login
project.route.security=/dashboard/index
project.output.generated-pages-package=ua.demo.agentlab.ui.generated.pages
project.output.generated-tests-package=ua.demo.agentlab.ui.generated.tests

# API demo profile. GoRest GET endpoints can run without a token.
# Mutation endpoints require API_AUTH_TOKEN.
project.api.base-url=https://gorest.co.in
api.base-url=https://gorest.co.in
api.auth.token=${API_AUTH_TOKEN}
project.api.endpoint-seed=GET /public/v2/users listUsers; GET /public/v2/users/{id} getUser; GET /public/v2/posts listPosts; GET /public/v2/comments listComments; GET /public/v2/todos listTodos

# UI runtime
ui.base-url=${project.base-url}
ui.browser=chrome
ui.headless=true
ui.timeout-seconds=10

# Discovery authentication. These values are read from environment variables.
discovery.auth.enabled=true
discovery.auth.username=${TEST_VALID_USERNAME}
discovery.auth.password=${TEST_VALID_PASSWORD}
discovery.auth.username-selector=input[name='username'], input#username, input[type='email'], input[name*='user' i], input[id*='user' i]
discovery.auth.password-selector=input[name='password'], input#password, input[type='password'], input[name*='pass' i], input[id*='pass' i]
discovery.auth.submit-selector=button[type='submit'], input[type='submit'], button, input[type='button']
discovery.auth.timeout-seconds=5

# OpenAI assistive layer
openai.enabled=true
openai.strict=true
openai.assistive-only=true
openai.model=gpt-5-mini
openai.base-url=https://api.openai.com/v1
openai.api-key=${OPENAI_API_KEY}
openai.max-output-tokens=4000

# RAG / vector store
rag.enabled=true
rag.qdrant.url=http://localhost:6333
rag.qdrant.api-key=${RAG_QDRANT_API_KEY}
rag.qdrant.collection=agentlab-project-style
rag.index.chunks-jsonl=target/rag/chunks.jsonl
rag.chunk.max-chars=1800
rag.chunk.overlap-chars=250
rag.retrieval.limit=8
rag.openai.api-key=${RAG_OPENAI_API_KEY}
rag.openai.embedding-model=text-embedding-3-small
rag.openai.generation-model=gpt-5-mini
rag.openai.base-url=https://api.openai.com/v1
rag.openai.max-output-tokens=1800

# UI knowledge graph + vector persistence
knowledge.graph.enabled=true
knowledge.graph.neo4j.url=http://localhost:7474
knowledge.graph.neo4j.database=neo4j
knowledge.graph.neo4j.username=neo4j
knowledge.graph.neo4j.password=${KNOWLEDGE_GRAPH_NEO4J_PASSWORD}
knowledge.vector.enabled=true
knowledge.vector.qdrant.url=http://localhost:6333
knowledge.vector.qdrant.api-key=${KNOWLEDGE_VECTOR_QDRANT_API_KEY}
knowledge.vector.qdrant.collection=agentlab-ui-knowledge
knowledge.vector.openai.api-key=${KNOWLEDGE_VECTOR_OPENAI_API_KEY}
knowledge.vector.openai.embedding-model=text-embedding-3-small
knowledge.vector.openai.base-url=https://api.openai.com/v1

# Legacy/generated runtime compatibility layer
test.base-url=${project.base-url}
test.browser=chrome
test.headless=true
test.timeout-seconds=10
test.credentials.valid.username=${TEST_VALID_USERNAME}
test.credentials.valid.password=${TEST_VALID_PASSWORD}
test.credentials.invalid.username=${TEST_INVALID_USERNAME}
test.credentials.invalid.password=${TEST_INVALID_PASSWORD}
