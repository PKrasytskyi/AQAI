services:
  neo4j:
    image: neo4j:5.26
    container_name: agentlab-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${KNOWLEDGE_GRAPH_NEO4J_PASSWORD:-local-neo4j-password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./infra/neo4j:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: agentlab-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/collections || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_storage:
