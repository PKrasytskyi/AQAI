name: Build Week OrangeHRM Demo

on:
  workflow_dispatch:
    inputs:
      database_mode:
        description: "Knowledge mode for this demo run"
        required: true
        default: without-db
        type: choice
        options:
          - without-db
          - with-db

permissions:
  contents: read

concurrency:
  group: build-week-orangehrm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orangehrm-demo:
    name: Requirements to Executed Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      TEST_VALID_USERNAME: ${{ secrets.TEST_VALID_USERNAME }}
      TEST_VALID_PASSWORD: ${{ secrets.TEST_VALID_PASSWORD }}
      KNOWLEDGE_DB_STATUS: ${{ inputs.database_mode == 'with-db' && 'true' || 'false' }}
      KNOWLEDGE_GRAPH_NEO4J_PASSWORD: ${{ secrets.KNOWLEDGE_GRAPH_NEO4J_PASSWORD }}
      KNOWLEDGE_GRAPH_NEO4J_URL: http://localhost:7474
      KNOWLEDGE_VECTOR_QDRANT_URL: http://localhost:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is required"; exit 1; }
          test -n "$TEST_VALID_USERNAME" || { echo "TEST_VALID_USERNAME is required"; exit 1; }
          test -n "$TEST_VALID_PASSWORD" || { echo "TEST_VALID_PASSWORD is required"; exit 1; }
          if [ "$KNOWLEDGE_DB_STATUS" = "true" ]; then
            test -n "$KNOWLEDGE_GRAPH_NEO4J_PASSWORD" || { echo "KNOWLEDGE_GRAPH_NEO4J_PASSWORD is required for with-db"; exit 1; }
          fi

      - name: Start Neo4j and Qdrant
        if: ${{ inputs.database_mode == 'with-db' }}
        shell: bash
        run: |
          docker run -d --name agentlab-neo4j \
            -p 7474:7474 -p 7687:7687 \
            -e NEO4J_AUTH="neo4j/$KNOWLEDGE_GRAPH_NEO4J_PASSWORD" \
            neo4j:5-community
          docker run -d --name agentlab-qdrant \
            -p 6333:6333 qdrant/qdrant:v1.14.1
          for attempt in {1..30}; do
            curl --silent --fail http://localhost:7474 >/dev/null \
              && curl --silent --fail http://localhost:6333/healthz >/dev/null \
              && exit 0
            sleep 2
          done
          echo "Knowledge services did not become ready"
          exit 1

      - name: Compile platform
        run: mvn --batch-mode --no-transfer-progress compile

      - name: Run unit and invariant tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Run manifest-driven OrangeHRM demo
        run: mvn --batch-mode --no-transfer-progress exec:java "-Dexec.args=--demo orangehrm"

      - name: Upload Build Week evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangehrm-build-week-${{ inputs.database_mode }}
          path: |
            target/ai-run/
            target/discovery/
            target/surefire-reports/
            src/test/java/ua/demo/agentlab/ui/generated/
          if-no-files-found: warn
